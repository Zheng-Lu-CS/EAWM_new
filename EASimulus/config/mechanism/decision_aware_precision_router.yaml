# @package mechanism.decision_aware_precision_router

enabled: False

# Fixed-slot precision allocation. The token count remains unchanged; low-precision
# slots receive local summary embeddings instead of their full token embeddings.
target_keep_ratio: 0.5
min_keep_ratio: 0.05
temperature: 1.0
hard: True
router: gumbel  # gumbel | topk | soft
summary: local_mean  # local_mean | global_mean | learned
summary_kernel: 2

# Regularization terms are only applied to world-model training.
budget_loss_weight: 0.01
entropy_loss_weight: 0.0

# Scalar side-channel capacity per patch. The implementation currently feeds
# token-change/event-style features by default and accepts uncertainty/error/
# saliency maps from diagnostics or future rollout hooks.
feature_dim: 4
# Drop side-channel features during router training so deployment paths that
# only have image embeddings, such as single-frame environment interaction, are
# covered by the router's training distribution.
feature_dropout_prob: 0.5
hidden_dim: 128
use_positional_features: True
detach_summary: True
warmup_epochs: 25
